<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div data-component="header"></div>

    <main>
      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="section-title">
              <span class="dot"></span>
              <span>Categories</span>
            </div>
          </div>

          <div class="category-row" id="home-categories"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="section-title">
              <span class="dot"></span>
              <span>Daily Discover</span>
            </div>
          </div>

          <div class="product-grid" id="home-products"></div>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <button class="back-to-top" type="button" aria-label="回到最上面" title="回到最上面">
      ↑
    </button>

    <script src="./js/products.js"></script>
    <script src="./js/components.js"></script>
    <script>
      document.querySelector('#home-categories').innerHTML = Object.entries(window.PRODUCT_CATEGORIES).map(([id, category]) => `
        <a class="category-card" href="category.html?type=${id}">
          <div class="category-icon">${category.icon}</div>
          <p>${category.name}</p>
        </a>`).join('');

      document.querySelector('#home-products').innerHTML = window.PRODUCTS.map((product) => `
        <a class="product-card" href="product.html?id=${product.id}">
          <div class="product-image">${product.images[0]}</div>
          <div class="product-info">
            <p class="product-name">${product.name}</p>
            <div class="product-price"><span class="price-main">$${product.price}</span></div>
          </div>
        </a>`).join('');
    </script>
  </body>
</html>
