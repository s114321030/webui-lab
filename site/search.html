<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>搜尋商品</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div data-component="header"></div>

    <main class="search-page">
      <section class="section">
        <div class="container">
          <div class="section-header">
            <div class="section-title">
              <span class="dot"></span>
              <span id="search-title">搜尋結果</span>
            </div>
          </div>
          <div class="controls-row">
            <div class="sort-bar" aria-label="商品排序">
              <label for="search-sort">排序</label>
              <select id="search-sort">
                <option value="newest">最新上架</option>
                <option value="oldest">最早上架</option>
                <option value="cheap">價格由低到高</option>
                <option value="expensive">價格由高到低</option>
              </select>
            </div>
            <form class="filter-bar" id="search-filter" aria-label="價格過濾">
            <div class="price-filter">
              <span class="filter-label">價格</span>
              <div class="price-range-control">
                <div class="price-slider">
                  <div class="price-track-fill"></div>
                  <input class="price-range price-range-max" id="search-price-range-max" type="range" min="0" max="100" value="100" aria-label="最高價格滑桿" />
                </div>
                <input class="price-input" id="search-price-max" name="priceMax" type="number" min="0" max="100" placeholder="最高" aria-label="最高價格" />
              </div>
            </div>
            <button type="submit">套用</button>
            </form>
          </div>
          <div class="product-grid" id="search-results"></div>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <button class="back-to-top" type="button" aria-label="回到最上面" title="回到最上面">↑</button>

    <script src="./js/components.js"></script>
    <script>
      const products = [
        { id: 1, category: '運動休閒', image: '👟', name: 'Casual running shoes', price: '$39', date: '2026-09-18' },
        { id: 2, category: '數位週邊', image: '📱', name: 'Smartphone case', price: '$18', date: '2026-09-16' },
        { id: 3, category: '其他', image: '🧴', name: 'Hydrating skincare set', price: '$29', date: '2026-09-14' },
        { id: 4, category: '其他', image: '👜', name: 'Minimalist shoulder bag', price: '$45', date: '2026-09-12' },
        { id: 5, category: '數位週邊', image: '⌚', name: 'Classic digital watch', price: '$64', date: '2026-09-10' },
        { id: 6, category: '教科書', image: '📖', name: 'College calculus textbook', price: '$32', date: '2026-09-08' },
        { id: 7, category: '教科書', image: '📘', name: 'English writing handbook', price: '$24', date: '2026-09-06' },
        { id: 8, category: '宿舍家電', image: '☕', name: 'Compact dorm coffee maker', price: '$55', date: '2026-09-04' },
        { id: 9, category: '宿舍家電', image: '🪭', name: 'Portable desk fan', price: '$22', date: '2026-09-02' },
        { id: 10, category: '交通', image: '🚲', name: 'Bicycle helmet', price: '$28', date: '2026-08-30' },
        { id: 11, category: '交通', image: '🚌', name: 'Transit card holder', price: '$12', date: '2026-08-28' },
        { id: 12, category: '運動休閒', image: '🏀', name: 'Indoor basketball', price: '$26', date: '2026-08-26' },
        { id: 13, category: '運動休閒', image: '🎒', name: 'Weekend hiking backpack', price: '$58', date: '2026-08-24' },
        { id: 14, category: '其他', image: '🕯️', name: 'Scented study room candle', price: '$16', date: '2026-08-22' },
        { id: 15, category: '數位週邊', image: '🎧', name: 'Wireless study headphones', price: '$72', date: '2026-08-20' }
      ];

      const params = new URLSearchParams(window.location.search);
      const query = params.get('q')?.trim() || '';
      const sort = params.get('sort') || 'newest';
      const priceMax = params.get('priceMax') || '';
      const keyword = query.toLowerCase();
      const matchingProducts = products.filter((product) =>
        `${product.name} ${product.category}`.toLowerCase().includes(keyword)
      );
      const pageMaxPrice = Math.max(...matchingProducts.map((product) => Number.parseInt(product.price.slice(1))), 1);
      const selectedPriceMax = priceMax ? Math.min(Number(priceMax), pageMaxPrice) : pageMaxPrice;
      const results = matchingProducts.filter((product) =>
        Number.parseInt(product.price.slice(1)) <= selectedPriceMax
      );

      results.sort((first, second) => {
        if (sort === 'oldest') return first.date.localeCompare(second.date);
        if (sort === 'cheap') return Number.parseInt(first.price.slice(1)) - Number.parseInt(second.price.slice(1));
        if (sort === 'expensive') return Number.parseInt(second.price.slice(1)) - Number.parseInt(first.price.slice(1));
        return second.date.localeCompare(first.date);
      });

      document.title = query ? `${query} | 搜尋結果` : '搜尋商品';
      document.querySelector('#search-sort').value = sort;
      document.querySelector('#search-sort').addEventListener('change', (event) => {
        params.set('sort', event.target.value);
        window.location.search = params.toString();
      });
      const searchPriceMaxInput = document.querySelector('#search-price-max');
      const searchPriceMaxRange = document.querySelector('#search-price-range-max');
      const searchPriceFill = document.querySelector('.price-track-fill');
      searchPriceMaxInput.max = pageMaxPrice;
      searchPriceMaxInput.value = selectedPriceMax;
      searchPriceMaxRange.max = pageMaxPrice;
      searchPriceMaxRange.value = selectedPriceMax;
      const updateSearchPriceRange = () => {
        let max = Number(searchPriceMaxRange.value);
        const sliderWidth = searchPriceMaxRange.clientWidth;
        const thumbRadius = 8;
        const fillWidth = thumbRadius + (max / pageMaxPrice) * (sliderWidth - thumbRadius * 2);
        searchPriceFill.style.width = `${fillWidth}px`;
      };
      searchPriceMaxRange.addEventListener('input', () => {
        searchPriceMaxInput.value = searchPriceMaxRange.value;
        updateSearchPriceRange();
      });
      searchPriceMaxInput.addEventListener('input', () => {
        searchPriceMaxRange.value = Math.max(0, Math.min(Number(searchPriceMaxInput.value) || 0, pageMaxPrice));
        updateSearchPriceRange();
      });
      updateSearchPriceRange();
      document.querySelector('#search-filter').addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        ['priceMax'].forEach((key) => {
          const value = formData.get(key);
          if (value) params.set(key, value);
          else params.delete(key);
        });
        window.location.search = params.toString();
      });
      document.querySelector('#search-title').textContent = query
        ? `「${query}」的搜尋結果 (${results.length})`
        : '請輸入搜尋關鍵字';
      document.querySelector('#search-results').innerHTML = query && results.length
        ? results.map((product) => `
            <a class="product-card" href="product.html?id=${product.id}">
              <div class="product-image">${product.image}</div>
              <div class="product-info">
                <p class="product-name">${product.name}</p>
                <div class="product-price"><span class="price-main">${product.price}</span></div>
              </div>
            </a>`).join('')
        : `<p class="product-description search-empty">${query ? '找不到符合的商品。' : '請使用上方搜尋列開始搜尋。'}</p>`;

    </script>
  </body>
</html>
