<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品詳情</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div data-component="header"></div>

    <main>
      <section class="product-detail-section">
        <div class="container">
          <div class="product-detail">
            <div class="product-gallery" aria-label="商品圖片">
              <div class="product-gallery-track" id="product-gallery-track"></div>
            </div>
            <div class="product-detail-info">
              <span class="product-label">現貨商品</span>
              <h1 id="product-name"></h1>
              <p class="product-detail-price" id="product-price"></p>
              <p class="product-description">精心挑選的優質商品，適合日常使用。商品狀況良好，出貨前會再次確認內容與包裝。</p>
              <div class="product-seller">
                <span class="seller-avatar">R</span>
                <div>
                  <strong>優質賣家</strong>
                  <small>已上架於 <span id="product-date"></span></small>
                </div>
              </div>
              <div class="product-actions">
                <button class="contact-seller" type="button">💬 聯絡賣家</button>
                <button class="add-to-cart" type="button">🛒 加入購物車</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section recommendation-section">
        <div class="container">
          <div class="section-header">
            <div class="section-title">
              <span class="dot"></span>
              <span>為您推薦</span>
            </div>
          </div>
          <div class="product-grid" id="recommendations"></div>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <button class="back-to-top" type="button" aria-label="回到最上面" title="回到最上面">↑</button>

    <script src="./js/components.js"></script>
    <script>
      const products = {
        1: { images: ['👟', '🏃', '🛣️'], name: 'Casual running shoes', price: '$39', date: '2026/09/18' },
        2: { images: ['📱', '🛡️'], name: 'Smartphone case', price: '$18', date: '2026/09/16' },
        3: { images: ['🧴', '✨'], name: 'Hydrating skincare set', price: '$29', date: '2026/09/14' },
        4: { images: ['👜', '👝'], name: 'Minimalist shoulder bag', price: '$45', date: '2026/09/12' },
        5: { images: ['⌚', '⏱️'], name: 'Classic digital watch', price: '$64', date: '2026/09/10' },
        6: { images: ['📖', '🧮'], name: 'College calculus textbook', price: '$32', date: '2026/09/08' },
        7: { images: ['📘', '✍️'], name: 'English writing handbook', price: '$24', date: '2026/09/06' },
        8: { images: ['☕', '🔌'], name: 'Compact dorm coffee maker', price: '$55', date: '2026/09/04' },
        9: { images: ['🪭', '🌬️'], name: 'Portable desk fan', price: '$22', date: '2026/09/02' },
        10: { images: ['🚲', '⛑️'], name: 'Bicycle helmet', price: '$28', date: '2026/08/30' },
        11: { images: ['🚌', '💳'], name: 'Transit card holder', price: '$12', date: '2026/08/28' },
        12: { images: ['🏀', '⛹️'], name: 'Indoor basketball', price: '$26', date: '2026/08/26' },
        13: { images: ['🎒', '🥾'], name: 'Weekend hiking backpack', price: '$58', date: '2026/08/24' },
        14: { images: ['🕯️', '🌿'], name: 'Scented study room candle', price: '$16', date: '2026/08/22' },
        15: { images: ['🎧', '🎵'], name: 'Wireless study headphones', price: '$72', date: '2026/08/20' }
      };

      const productId = new URLSearchParams(window.location.search).get('id') || '1';
      const product = products[productId] || products[1];
      document.title = product.name;
      const gallery = document.querySelector('.product-gallery');
      const galleryTrack = document.querySelector('#product-gallery-track');
      const galleryImages = product.images;
      const cloneCount = 2;
      const loopedImages = [
        ...galleryImages.slice(-cloneCount),
        ...galleryImages,
        ...galleryImages.slice(0, cloneCount)
      ];
      let galleryIndex = cloneCount;
      let pointerStart = 0;
      let pointerDelta = 0;
      let isDragging = false;

      galleryTrack.innerHTML = loopedImages.map((image) => `
        <div class="product-detail-image product-gallery-slide">${image}</div>`).join('');

      const getGalleryStep = () => {
        const gap = Number.parseFloat(getComputedStyle(galleryTrack).gap) || 0;
        return gallery.clientWidth / 2 + gap / 2;
      };
      const moveGallery = (withAnimation = true) => {
        galleryTrack.style.transition = withAnimation ? 'transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1)' : 'none';
        galleryTrack.style.transform = `translateX(-${galleryIndex * getGalleryStep()}px)`;
      };

      galleryTrack.addEventListener('transitionend', () => {
        if (galleryIndex < cloneCount) {
          galleryIndex += galleryImages.length;
          moveGallery(false);
        }
        if (galleryIndex >= galleryImages.length + cloneCount) {
          galleryIndex -= galleryImages.length;
          moveGallery(false);
        }
      });

      gallery.addEventListener('pointerdown', (event) => {
        isDragging = true;
        pointerStart = event.clientX;
        pointerDelta = 0;
        galleryTrack.style.transition = 'none';
        gallery.setPointerCapture(event.pointerId);
      });

      gallery.addEventListener('pointermove', (event) => {
        if (!isDragging) return;
        pointerDelta = event.clientX - pointerStart;
        galleryTrack.style.transform = `translateX(${pointerDelta - galleryIndex * getGalleryStep()}px)`;
      });

      gallery.addEventListener('pointerup', (event) => {
        if (!isDragging) return;
        isDragging = false;
        gallery.releasePointerCapture(event.pointerId);
        if (Math.abs(pointerDelta) > 45) {
          galleryIndex += pointerDelta < 0 ? 1 : -1;
        }
        moveGallery(true);
      });

      gallery.addEventListener('pointercancel', () => {
        isDragging = false;
        moveGallery(true);
      });

      window.addEventListener('resize', () => moveGallery(false));
      moveGallery(false);
      document.querySelector('#product-name').textContent = product.name;
      document.querySelector('#product-price').textContent = product.price;
      document.querySelector('#product-date').textContent = product.date;

      document.querySelector('#recommendations').innerHTML = Object.entries(products)
        .filter(([id]) => id !== productId)
        .slice(0, 4)
        .map(([id, item]) => `
          <a class="product-card" href="product.html?id=${id}">
            <div class="product-image">${item.images[0]}</div>
            <div class="product-info">
              <p class="product-name">${item.name}</p>
              <div class="product-price"><span class="price-main">${item.price}</span></div>
            </div>
          </a>`)
        .join('');

    </script>
  </body>
</html>
